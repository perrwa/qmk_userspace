name: Release QMK firmware
on:
  push:
    branches: [main]
    paths-ignore:
      - "keymap-drawer/**"
      - "keymap_drawer.config.yaml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g., v25.08.1)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: 'QMK Userspace Build'
    permissions:
      contents: write
    uses: ./.github/workflows/_userspace-build.yml
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: master

  release:
    name: 'QMK Userspace Release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout (for tag listing)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Determine release tag
        id: tag
        # Tag convention: vYY.MM.N (e.g., v25.08.1, v25.08.2)
        run: |
          if [ -n "$TAG" ]; then
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          else
            PREFIX="v$(date +%y.%m)"
            LAST=$(git tag -l "${PREFIX}.*" --sort=-v:refname | head -n1)
            if [ -n "$LAST" ]; then
              SUFFIX=${LAST##*.}
              if echo "$SUFFIX" | grep -qE '^[0-9]+$'; then
                N=$(( SUFFIX + 1 ))
              else
                N=1
              fi
            else
              N=1
            fi
            echo "name=${PREFIX}.${N}" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ github.event.inputs.tag || '' }}

      - name: Download firmware artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Firmware
          path: ./release

      - name: Flatten firmware files
        run: |
          mkdir -p ./flat
          find ./release -type f \( -name '*.hex' -o -name '*.bin' -o -name '*.uf2' \) -exec cp {} ./flat/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: ./flat/*
          draft: true
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
